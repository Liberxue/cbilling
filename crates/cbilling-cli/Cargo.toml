[package]
name = "cbilling-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Terminal UI for multi-cloud billing — htop/k9s style dashboard"
homepage = "https://github.com/Liberxue/cbilling"
repository = "https://github.com/Liberxue/cbilling"
readme = "README.md"
keywords = ["cloud", "billing", "tui", "dashboard", "terminal"]
categories = ["command-line-utilities", "finance"]
rust-version = "1.85"

[[bin]]
name = "cbilling"
path = "src/main.rs"

[dependencies]
cbilling = { version = "0.1.0", path = "../..", features = ["all-providers"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
